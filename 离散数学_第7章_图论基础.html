/* Fixed 16:9 stage used by every generated chapter wrapper. */
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg,#000)}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg,#000)}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg,#fff)}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg,#fff)}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
img,video,canvas,svg{max-width:100%;max-height:100%}
.deck-controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000}
@media print{
  html,body{width:1920px;height:auto;overflow:visible;background:#fff}

  .deck-stage{position:static;width:auto;height:auto;transform:none!important;background:none}
  .slide{position:relative;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;width:1920px;height:1080px;break-after:page;page-break-after:always}
  .slide:last-child{break-after:auto;page-break-after:auto}
  .deck-controls{display:none!important}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important}}

<script>

(function(){
  const frame=document.getElementById('bookFrame');
  if(!frame) return;

  function currentBodyName(){
    const me=(location.pathname||location.href).split(/[\/]/).pop()||'';
    const base=me.replace(/[?#].*$/,'').replace(/\.html$/i,'');
    return base + '.body.html';
  }

  function resolveInDoc(doc){
    if(!doc) return;
    var bases=[];
    try{ if(frame.contentWindow && frame.contentWindow.location && frame.contentWindow.location.href) bases.push(frame.contentWindow.location.href); }catch(e){}
    bases.push(location.href);
    doc.querySelectorAll('video[data-app-video], .app-video-stage video').forEach(function(v){
      var rel=v.getAttribute('data-app-video')||v.getAttribute('src');
      if(!rel) return;
      // keep relative if already under assets/
      var abs=null;
      for(var i=0;i<bases.length;i++){
        try{ abs=new URL(rel, bases[i]).href; break; }catch(e){}
      }
      if(!abs) abs=rel;
      if((v.getAttribute('src')||'')!==abs){
        v.setAttribute('src', abs);
        try{ v.load(); }catch(e){}
      }
    });
  }

  function onFrameReady(){
    const loading=document.getElementById('loading');
    if(loading) loading.style.display='none';
    try{ frame.contentWindow && frame.contentWindow.focus(); }catch(e){}
    try{
      const doc=frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
      resolveInDoc(doc);
      // retries: slide pages may mount late
      setTimeout(()=>resolveInDoc(doc), 200);
      setTimeout(()=>resolveInDoc(doc), 800);
      setTimeout(()=>resolveInDoc(frame.contentDocument), 2000);
      // Static iframe content is resolved by the load hook and scheduled retries above.
    }catch(e){ console.warn(e); }

    const qs=new URLSearchParams(location.search);
    const pg=parseInt(qs.get('p')||(location.hash.match(/p=(\d+)/)||[])[1],10);
    if(pg>0){setTimeout(function(){try{frame.contentWindow.__deckGoTo(pg-1);}catch(e){}},120);}
    const tool=qs.get('tool');
    const toolKeys={toc:'m',grid:'g',search:'/',help:'?',bookmark:'b',focus:'f',font:'t',res:'v',audio:'a',code:'c'};
    if(tool && toolKeys[tool]){
      setTimeout(()=>{
        try{
          const d=frame.contentDocument;
          if(!d) return;
          d.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown',{key:toolKeys[tool],bubbles:true,cancelable:true}));
        }catch(e){}
      }, 220);
    }
  }

  frame.addEventListener('load', onFrameReady);

  // Primary: load sibling body.html so relative assets resolve against real file URL
  const bodyName=currentBodyName();
  if(!frame.getAttribute("src"))frame.src=bodyName+'?v=20260929';

  // Keyboard proxy to iframe
  addEventListener('keydown',e=>{
    const tag=(e.target&&e.target.tagName||'').toUpperCase();
    if((tag==='A'||tag==='BUTTON')&&e.key==='Enter')return;
    const key=e.key;
    const plain=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','PageUp','PageDown','Home','End','Escape','m','M','g','G','/','?','b','B','f','F','t','T','v','V','a','A','c','C'];
    const shortcut=plain.indexOf(key)>-1||((e.ctrlKey||e.metaKey)&&(key==='k'||key==='K'));
    if(!shortcut)return;
    try{
      if(!frame.contentDocument)return;
      const init={key:key,code:e.code||'',bubbles:true,cancelable:true,ctrlKey:!!e.ctrlKey,metaKey:!!e.metaKey,shiftKey:!!e.shiftKey,altKey:!!e.altKey};
      frame.contentDocument.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown',init));
      e.preventDefault(); e.stopPropagation();
    }catch(err){}
  }, true);
})();

</script>

<script id="fit-stage-v4">
(function(){
  var stage=document.getElementById('deckStage');
  if(!stage) return;
  function fit(){
    var w=window.innerWidth,h=window.innerHeight;
    if(!w||!h) return;
    h-=26;var s=Math.min(w/1920,h/1080);
    stage.style.transform='translate('+((w-1920*s)/2)+'px,'+((h-1080*s)/2)+'px) scale('+s+')';
  }
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',fit);
  fit();
  setTimeout(fit,120);
})();
</script>
